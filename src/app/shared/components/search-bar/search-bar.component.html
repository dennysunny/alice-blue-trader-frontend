<div class="search-bar">
  <span class="search-bar__icon">🔍</span>
  <input
    class="search-bar__input"
    [formControl]="control"
    [placeholder]="placeholder"
    autocomplete="off"
    spellcheck="false"
  />
  <button
    *ngIf="control.value"
    class="search-bar__clear"
    (click)="clear()"
    type="button"
  >✕</button>
</div>
