<nav class="navbar">
  <div class="navbar__left">
    <button class="navbar__menu-btn" (click)="menuToggle.emit()" title="Toggle sidebar">
      ☰
    </button>
    <div class="navbar__brand">
      <span class="navbar__brand-mark">ANT</span>
      <span class="navbar__brand-name">AliceBlue</span>
    </div>
  </div>

  <div class="navbar__center">
    <div class="market-status">
      <span class="market-status__dot"></span>
      <span class="market-status__label">NSE · Live</span>
    </div>
  </div>

  <div class="navbar__right">
    <button class="navbar__icon-btn" (click)="toggleTheme()" [title]="isDark ? 'Light mode' : 'Dark mode'">
      {{ isDark ? '☀️' : '🌙' }}
    </button>

    <div class="navbar__user">
      <button class="navbar__avatar" (click)="goToProfile()" >{{ userName.slice(0,3) }}</button>
    </div>

    <button class="navbar__logout_btn navbar__logout" (click)="logout()" title="Logout">
      ➜]
    </button>
  </div>
</nav>
