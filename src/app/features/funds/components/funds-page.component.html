<div class="funds-page">
  <div class="funds-page__header">
    <h1 class="page-title">Funds</h1>
  </div>

  @if (loading) {
    <div class="loading-overlay"><app-spinner size="lg"></app-spinner></div>
  } @else {
    @if (fundsGroups.length) {
      <div class="funds-grid">
        @for (group of fundsGroups; track $index) {
          <div class="card funds-card">
            <div class="funds-card__segment">{{ group.segment }}</div>
            <table class="data-table">
              <tbody>
                @for (row of group.rows; track $index) {
                  <tr [class.funds-row--highlight]="row.highlight">
                    <td class="funds-row__label">{{ row.label }}</td>
                    <td class="text-right font-mono funds-row__value">
                      {{ row.value | inr }}
                    </td>
                  </tr>
                }
              </tbody>
            </table>
          </div>
        }
      </div>
    } @else {
      <app-empty-state
        icon="₹"
        title="No funds data"
        subtitle="Margin information will appear here"
      ></app-empty-state>
    }
  }
</div>
